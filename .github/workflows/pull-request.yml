name: pull request

# Checks that a pull request names the issue it belongs to, so the issue,
# its milestone and the project board stay in step without anyone linking
# things by hand afterwards. See CONTRIBUTING.md, "Linking work".

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linked-issue:
    name: linked issue
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require "Part of #N" or "Closes #N" in the description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-linked-issue.mjs
