name: docs

# Checks every Markdown file: style (markdownlint), links (lychee), the
# front matter of documents under docs/, and that Mermaid diagrams parse.
#
# Pull requests and pushes check relative links and heading anchors only, so
# the result depends on the repository alone. External URLs are checked on a
# weekly schedule (and on demand), where a third-party outage cannot block a
# merge.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: markdownlint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --include-fragments
            --root-dir ${{ github.workspace }}
            ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--max-retries 3' || '--offline' }}
            "**/*.md"
          fail: true

  front-matter:
    name: front matter
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/check-front-matter.mjs

  mermaid:
    name: mermaid
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Use the runner's Chrome rather than downloading one for Puppeteer.
      - name: Check that every Mermaid diagram renders
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          CHROME_PATH="$(command -v google-chrome)" node scripts/check-mermaid.mjs

  script-tests:
    name: script tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The end-to-end tests drive the real Mermaid CLI, so they need Chrome.
      - name: Test the check scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          CHROME_PATH="$(command -v google-chrome)" node --test scripts/*.test.mjs
